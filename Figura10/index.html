<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elementos de la retención</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      background: #ffffff;
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
    }

    .contenedor {
      width: 100%;
      max-width: 1450px;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* =============================
       FILAS
    ============================= */

    .fila {
      display: grid;
      grid-template-columns: 36% 64%;
      min-height: 90px;

      opacity: 0;
      filter: blur(5px);
    }

    /* 1, 3 y 5 desde la izquierda */
    .fila:nth-child(odd) {
      transform: translateX(-180px);
    }

    /* 2 y 4 desde la derecha */
    .fila:nth-child(even) {
      transform: translateX(180px);
    }

    .fila:nth-child(odd).visible {
      animation: entradaIzquierda 0.8s
        cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .fila:nth-child(even).visible {
      animation: entradaDerecha 0.8s
        cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* =============================
       BLOQUE IZQUIERDO
    ============================= */

    .titulo {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px 25px;

      color: #ffffff;
      text-align: center;

      border-radius: 14px 0 0 14px;
    }

    .titulo h2 {
      font-size: clamp(1.5rem, 2.7vw, 2.6rem);
      font-weight: 800;
      line-height: 1.05;
      text-transform: uppercase;
    }

    /* =============================
       BLOQUE DERECHO
    ============================= */

    .descripcion {
      display: flex;
      align-items: center;

      padding: 18px 26px;

      color: #ffffff;

      border-radius: 0 14px 14px 0;
    }

    .descripcion p {
      font-size: clamp(1rem, 2vw, 1.65rem);
      font-weight: 600;
      line-height: 1.15;
    }

    /* =============================
       COLORES
    ============================= */

    .fila-1 .titulo {
      background: #03223D;
    }

    .fila-1 .descripcion {
      background: #5D7085;
    }

    .fila-2 .titulo {
      background: #1F4B71;
    }

    .fila-2 .descripcion {
      background: #6F8AA4;
    }

    .fila-3 .titulo {
      background: #3E79A8;
    }

    .fila-3 .descripcion {
      background: #83A4C2;
    }

    .fila-4 .titulo {
      background: #3E5496;
    }

    .fila-4 .descripcion {
      background: #7F8DB8;
    }

    .fila-5 .titulo {
      background: #43388F;
    }

    .fila-5 .descripcion {
      background: #837CB7;
    }

    /* =============================
       HOVER
    ============================= */

    .fila {
      transition:
        transform 0.3s ease,
        filter 0.3s ease,
        box-shadow 0.3s ease;
    }

    .fila:hover {
      transform: translateY(-4px);
      filter: brightness(1.04);
      box-shadow: 0 12px 28px rgba(3, 34, 61, 0.12);
    }

    /* =============================
       ANIMACIONES
    ============================= */

    @keyframes entradaIzquierda {
      0% {
        opacity: 0;
        transform: translateX(-180px);
        filter: blur(5px);
      }

      65% {
        opacity: 1;
        transform: translateX(10px);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
      }
    }

    @keyframes entradaDerecha {
      0% {
        opacity: 0;
        transform: translateX(180px);
        filter: blur(5px);
      }

      65% {
        opacity: 1;
        transform: translateX(-10px);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
      }
    }

    /* =============================
       RESPONSIVE
    ============================= */

    @media (max-width: 900px) {
      .fila {
        grid-template-columns: 40% 60%;
        min-height: 80px;
      }

      .titulo {
        padding: 14px 18px;
      }

      .descripcion {
        padding: 14px 18px;
      }

      .titulo h2 {
        font-size: clamp(1.1rem, 3vw, 1.8rem);
      }

      .descripcion p {
        font-size: clamp(0.9rem, 2.4vw, 1.25rem);
      }
    }

    @media (max-width: 650px) {
      body {
        padding: 20px 12px;
      }

      .lista {
        gap: 12px;
      }

      .fila {
        grid-template-columns: 1fr;
      }

      .titulo,
      .descripcion {
        border-radius: 14px;
      }

      .titulo {
        min-height: 72px;
      }

      .descripcion {
        min-height: 72px;
        text-align: center;
        justify-content: center;
      }

      .titulo h2 {
        font-size: 1.25rem;
      }

      .descripcion p {
        font-size: 0.95rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fila {
        opacity: 1;
        transform: none !important;
        filter: none;
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <section
      class="lista"
      aria-label="Elementos de la retención"
    >

      <article class="fila fila-1" data-delay="0">

        <div class="titulo">
          <h2>Agente de retención</h2>
        </div>

        <div class="descripcion">
          <p>PN o PJ autorizada por la ley</p>
        </div>

      </article>

      <article class="fila fila-2" data-delay="1">

        <div class="titulo">
          <h2>Sujeto pasivo</h2>
        </div>

        <div class="descripcion">
          <p>Personas a la que se le práctica la retención</p>
        </div>

      </article>

      <article class="fila fila-3" data-delay="2">

        <div class="titulo">
          <h2>Hecho generador</h2>
        </div>

        <div class="descripcion">
          <p>
            Actividad que se realiza y que está sometida a retención
          </p>
        </div>

      </article>

      <article class="fila fila-4" data-delay="3">

        <div class="titulo">
          <h2>Base gravable</h2>
        </div>

        <div class="descripcion">
          <p>El valor sujeto a retención</p>
        </div>

      </article>

      <article class="fila fila-5" data-delay="4">

        <div class="titulo">
          <h2>Tarifa</h2>
        </div>

        <div class="descripcion">
          <p>Porcentaje aplicable de acuerdo a la ley</p>
        </div>

      </article>

    </section>

  </main>

  <script>
    const filas = document.querySelectorAll(".fila");

    let animacionEjecutada = false;

    function ejecutarAnimacion() {
      if (animacionEjecutada) return;

      animacionEjecutada = true;

      filas.forEach((fila, index) => {
        const orden =
          Number(fila.dataset.delay) || index;

        setTimeout(() => {
          fila.classList.add("visible");
        }, 300 + orden * 550);
      });
    }

    window.addEventListener(
      "load",
      ejecutarAnimacion
    );

    if (document.readyState === "complete") {
      ejecutarAnimacion();
    }
  </script>

</body>
</html>
