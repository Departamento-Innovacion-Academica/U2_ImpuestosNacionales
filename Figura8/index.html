<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Renta - Residente y no residente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
      background: #ffffff;
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
    }

    .diagrama {
      position: relative;
      width: 100%;
      max-width: 1000px;
      min-height: 560px;
    }

    /* =================================
       BLOQUES
    ================================= */

    .bloque {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;
      border-radius: 12px;

      color: #ffffff;
      text-align: center;

      opacity: 0;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        filter 0.3s ease;

      z-index: 3;
    }

    /* =================================
       RENTA - MÁS GRANDE
    ================================= */

    .renta {
      left: 0;
      top: 50%;
      width: 30%;
      height: 140px;

      background: #03223D;

      transform: translateY(-50%) translateX(-120px);
    }

    .renta.visible {
      animation: entradaIzquierda 0.8s
        cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .renta h2 {
      font-size: clamp(2.2rem, 4vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 2px;
    }

    /* =================================
       RESIDENTE - MÁS PEQUEÑO
    ================================= */

    .residente {
      left: 42%;
      top: 30px;

      width: 30%;
      height: 140px;

      background: #356289;

      transform: translateX(120px);
    }

    .residente.visible {
      animation: entradaDerecha 0.8s
        cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .residente h2 {
      font-size: clamp(1.5rem, 2.5vw, 2.4rem);
      font-weight: 700;
    }

    /* =================================
       NO RESIDENTE - MÁS PEQUEÑO
    ================================= */

    .no-residente {
      left: 42%;
      bottom: 30px;

      width: 30%;
      height: 140px;

      background: #356289;

      transform: translateX(120px);
    }

    .no-residente.visible {
      animation: entradaDerecha 0.8s
        cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .no-residente h2 {
      font-size: clamp(1.3rem, 2.2vw, 2rem);
      font-weight: 700;
    }

    /* =================================
       BLOQUES DERECHA - MÁS PEQUEÑOS
    ================================= */

    .colombia-residente {
      right: 0;
      top: 0;

      width: 20%;
      height: 140px;

      background: #4d62c8;

      transform: translateX(120px);
    }

    .colombia-residente h2 {
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      font-weight: 600;
    }

    .exterior {
      right: 0;
      top: 175px;

      width: 20%;
      height: 140px;

      background: #4d62c8;

      transform: translateX(120px);
    }

    .exterior h2 {
      font-size: clamp(0.9rem, 1.4vw, 1.3rem);
      font-weight: 600;
    }

    .colombia-no-residente {
      right: 0;
      bottom: 30px;

      width: 20%;
      height: 140px;

      background: #4d62c8;

      transform: translateX(120px);
    }

    .colombia-no-residente h2 {
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      font-weight: 600;
    }

    .colombia-residente.visible,
    .exterior.visible,
    .colombia-no-residente.visible {
      animation: entradaDerecha 0.8s
        cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* =================================
       LÍNEAS
    ================================= */

    .linea {
      position: absolute;
      height: 2.5px;
      background: #356289;
      z-index: 1;

      transform: scaleX(0);
    }

    /* Renta -> Residente */

    .linea-renta-residente {
      left: 29%;
      top: 50%;
      width: 18%;
      transform-origin: left center;
      rotate: -43deg;
    }

    /* Renta -> No residente */

    .linea-renta-no {
      left: 29%;
      top: 50%;
      width: 18%;
      transform-origin: left center;
      rotate: 43deg;
    }

    /* Residente -> Colombia */

    .linea-residente-colombia {
      left: 70%;
      top: 16%;
      width: 18%;
      transform-origin: left center;
      rotate: -30deg;
    }

    /* Residente -> Exterior */

    .linea-residente-exterior {
      left: 70%;
      top: 27%;
      width: 18%;
      transform-origin: left center;
      rotate: 30deg;
    }

    /* No residente -> Colombia */

    .linea-no-colombia {
      left: 70%;
      bottom: 17%;
      width: 18%;
      transform-origin: left center;
    }

    .linea.visible {
      animation: dibujarLinea 0.6s ease forwards;
    }

    /* =================================
       HOVER
    ================================= */

    .bloque:hover {
      filter: brightness(1.06);
      box-shadow: 0 14px 30px rgba(3, 34, 61, 0.16);
      transform: translateY(-5px);
    }

    /* =================================
       ANIMACIONES
    ================================= */

    @keyframes entradaIzquierda {
      0% {
        opacity: 0;
        transform: translateY(-50%) translateX(-120px);
        filter: blur(6px);
      }

      65% {
        opacity: 1;
        transform: translateY(-50%) translateX(8px);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
        filter: blur(0);
      }
    }

    @keyframes entradaDerecha {
      0% {
        opacity: 0;
        transform: translateX(120px);
        filter: blur(6px);
      }

      65% {
        opacity: 1;
        transform: translateX(-8px);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
      }
    }

    @keyframes dibujarLinea {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

    /* =================================
       RESPONSIVE
    ================================= */

    @media (max-width: 820px) {

      .diagrama {
        min-height: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .bloque {
        position: relative;
        top: auto;
        left: auto;
        right: auto;
        bottom: auto;

        width: 100%;
        height: auto;
        min-height: 90px;

        transform: translateY(50px);
      }

      .renta {
        transform: translateY(50px);
      }

      .renta.visible,
      .residente.visible,
      .no-residente.visible,
      .colombia-residente.visible,
      .exterior.visible,
      .colombia-no-residente.visible {
        animation: entradaAbajoMovil 0.8s
          cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .linea {
        display: none;
      }

      .renta h2 {
        font-size: clamp(2rem, 7vw, 3rem);
      }

      .residente h2 {
        font-size: clamp(1.3rem, 5vw, 2rem);
      }

      .no-residente h2 {
        font-size: clamp(1.2rem, 4.5vw, 1.8rem);
      }

      .colombia-residente h2,
      .colombia-no-residente h2 {
        font-size: clamp(1rem, 3.5vw, 1.5rem);
      }

      .exterior h2 {
        font-size: clamp(0.9rem, 3vw, 1.3rem);
      }
    }

    @keyframes entradaAbajoMovil {
      0% {
        opacity: 0;
        transform: translateY(50px);
        filter: blur(5px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bloque,
      .linea {
        opacity: 1;
        transform: none !important;
        animation: none !important;
        filter: none;
      }
    }
  </style>
</head>

<body>

  <main class="diagrama" aria-label="Clasificación de renta">

    <!-- RENTA -->
    <article class="bloque renta" id="renta">
      <h2>Renta</h2>
    </article>

    <!-- RAMAS DESDE RENTA -->
    <span class="linea linea-renta-residente" id="linea1"></span>
    <span class="linea linea-renta-no" id="linea2"></span>

    <!-- NIVEL 2 -->
    <article class="bloque residente" id="residente">
      <h2>Residente</h2>
    </article>

    <article class="bloque no-residente" id="noResidente">
      <h2>No residente</h2>
    </article>

    <!-- RAMAS DESDE RESIDENTE -->
    <span class="linea linea-residente-colombia" id="linea3"></span>
    <span class="linea linea-residente-exterior" id="linea4"></span>

    <!-- RAMA DESDE NO RESIDENTE -->
    <span class="linea linea-no-colombia" id="linea5"></span>

    <!-- NIVEL 3 -->
    <article class="bloque colombia-residente" id="colombiaResidente">
      <h2>En<br>Colombia</h2>
    </article>

    <article class="bloque exterior" id="exterior">
      <h2>En el<br>exterior</h2>
    </article>

    <article class="bloque colombia-no-residente" id="colombiaNoResidente">
      <h2>En<br>Colombia</h2>
    </article>

  </main>

  <script>
    const renta = document.getElementById("renta");

    const residente = document.getElementById("residente");
    const noResidente = document.getElementById("noResidente");

    const colombiaResidente =
      document.getElementById("colombiaResidente");

    const exterior =
      document.getElementById("exterior");

    const colombiaNoResidente =
      document.getElementById("colombiaNoResidente");

    const linea1 = document.getElementById("linea1");
    const linea2 = document.getElementById("linea2");
    const linea3 = document.getElementById("linea3");
    const linea4 = document.getElementById("linea4");
    const linea5 = document.getElementById("linea5");

    let animacionEjecutada = false;

    function ejecutarAnimacion() {

      if (animacionEjecutada) return;

      animacionEjecutada = true;

      // 1. Renta
      setTimeout(() => {
        renta.classList.add("visible");
      }, 300);

      // 2. Ramas principales
      setTimeout(() => {
        linea1.classList.add("visible");
        linea2.classList.add("visible");
      }, 1100);

      // 3. Residente
      setTimeout(() => {
        residente.classList.add("visible");
      }, 1700);

      // 4. No residente
      setTimeout(() => {
        noResidente.classList.add("visible");
      }, 2300);

      // 5. Ramas desde residente
      setTimeout(() => {
        linea3.classList.add("visible");
        linea4.classList.add("visible");
      }, 3000);

      // 6. En Colombia - residente
      setTimeout(() => {
        colombiaResidente.classList.add("visible");
      }, 3600);

      // 7. En el exterior
      setTimeout(() => {
        exterior.classList.add("visible");
      }, 4200);

      // 8. Rama no residente
      setTimeout(() => {
        linea5.classList.add("visible");
      }, 4800);

      // 9. En Colombia - no residente
      setTimeout(() => {
        colombiaNoResidente.classList.add("visible");
      }, 5400);
    }

    window.addEventListener("load", ejecutarAnimacion);

    if (document.readyState === "complete") {
      ejecutarAnimacion();
    }
  </script>

</body>
</html>
